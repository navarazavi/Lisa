<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lisa</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #F0EEE6;
      color: #1a1a1a;
    }

    header {
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.75), #F0EEE6 96%);
      padding: 0 30px;
      height: 110px;
      position: relative;
      box-shadow: 0 0.5px 3px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .logo-wrap {
      display: flex;
      align-items: flex-end;
      gap: 12px;
    }

    .logo {
      font-size: 60px;
      font-weight: 600;
      padding-bottom: 6px;
    }

    .logo .asterisk {
      color: #D97858;
    }

    .atom-icon {
      height: 61px;
      opacity: 0.9;
      animation: float 3s ease-in-out infinite;
      align-self: flex-start;
      margin-bottom: 8px;
    }

    .claude-logo-container {
      border: 1.6px solid #d3d3c3;
      border-radius: 12px;
      padding: 8px;
      background-color: #fff;
      margin-left: 16px;
    }

    .claude-logo {
      height: 83px;
      opacity: 0.9;
    }

    main {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: calc(100vh - 180px);
      padding: 0 30px;
      background-color: #ffffff;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .chat-bubble {
      font-size: 16px;
      margin: 0 0 40px 0;
      padding: 12px 16px;
      border-left: 6px solid #dfdfce;
      border-radius: 8px;
      border: 1.8px solid #d3d3c3;
      color: #2e2e2e;
      display: inline-block;
      max-width: fit-content;
    }

    .chat-bubble::before {
      content: "*";
      color: #D97858;
      margin-right: 8px;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #f4f4ec;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
    }

    .send-button {
      background-color: #e2e2d6;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
      font-size: 16px;
      font-weight: bold;
      color: #555;
      line-height: 1;
      flex-shrink: 0;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      background-color: #f4f4ec;
      margin-right: 12px;
    }

    input[type="text"]:focus {
      outline: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-wrap">
      <div class="logo">Li<span class="asterisk">*</span>SA</div>
      <img src="atom1.png" alt="Atom icon" class="atom-icon" />
    </div>
    <div class="claude-logo-container">
      <img src="claude.png" alt="Claude Logo" class="claude-logo" />
    </div>
  </header>

  <main>
    <div class="chat-bubble">I'm Lisa, your intelligent lab assistant. Got any questions?</div>
  </main>

  <footer>
    <input type="text" placeholder="Type a message . . ." />
    <button class="send-button" aria-label="Send message">↑</button>
  </footer>
</body>
</html>
