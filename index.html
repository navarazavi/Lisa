<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lisa UI</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      background: #f4f4ec;
      font-family: 'EB Garamond', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 40px;
    }

    .logo-block {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .logo-block h1 {
      font-size: 64px;
      margin: 0;
      font-weight: 500;
    }

    .logo-block img {
      height: 42px;
      animation: floaty 3.5s ease-in-out infinite;
    }

    @keyframes floaty {
      0% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0); }
    }

    .chat-card {
      background: #eaebe3;
      border: 1px solid #d4d2c5;
      border-radius: 10px;
      width: 640px;
      height: 720px;
      box-shadow: 8px 8px 0 #aaa8a0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(to bottom, rgba(255,255,255,0.85), #f4f4ec);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-bottom: 1px solid #ddd8c9;
      padding: 12px 20px 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header p {
      font-size: 13px;
      margin: 0;
    }

    .chat-header .label {
      display: flex;
      align-items: center;
      font-size: 16px;
    }

    .chat-header .label img {
      height: 16px;
      margin-right: 6px;
    }

    .chat-area {
      flex: 1;
      padding: 32px 20px;
    }

    .bot-intro {
      display: flex;
      align-items: center;
      font-size: 1rem;
      padding: 0 20px 12px 20px;
      gap: 10px;
    }

    .bot-icon {
      width: 14px;
      height: 14px;
      background-color: #dcd6c4;
      border-radius: 2px;
    }

    .input-row {
      border-top: 1px solid #ddd8c9;
      padding: 12px 20px 20px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 1rem;
      font-family: 'EB Garamond', serif;
      outline: none;
      color: #222;
    }

    input::placeholder {
      color: #999;
    }

    button {
      width: 36px;
      height: 36px;
      background-color: #dddacb;
      border: none;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      font-family: 'EB Garamond', serif;
      color: #222;
    }
  </style>
</head>
<body>
  <div class="logo-block">
    <h1>Lisa</h1>
    <img src="atoms.png" alt="Atoms icon" />
  </div>

  <div class="chat-card">
    <div class="chat-header">
      <p>Intelligent reasoning model trained to assist with laboratory operations.</p>
      <div class="label">
        <img src="claude-icon.svg" alt="Claude icon" />
        <span><strong>Claude</strong> Sonnet 4</span>
      </div>
    </div>

    <div class="chat-area"></div>

    <div class="bot-intro">
      <div class="bot-icon"></div>
      <p>Hello! Here to help. Got any questions?</p>
    </div>

    <div class="input-row">
      <input type="text" placeholder="Type a message . . ." />
      <button>↑</button>
    </div>
  </div>
</body>
</html>
