<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lisa UI</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #f4f4ec;
      font-family: 'EB Garamond', serif;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 40px;
      color: #111;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .logo-row h1 {
      font-size: 64px;
      font-weight: 500;
      margin: 0;
    }

    .logo-row img {
      height: 40px;
      animation: floaty 3.5s ease-in-out infinite;
    }

    @keyframes floaty {
      0% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0); }
    }

    .strip {
      width: 100%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.85), #f4f4ec);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-bottom: 1px solid #ddd8c9;
      padding: 8px 0 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      padding-left: 6px;
      padding-right: 20px;
    }

    .claude-label {
      display: flex;
      align-items: center;
      font-size: 16px;
    }

    .claude-label img {
      height: 16px;
      margin-right: 6px;
    }

    .chat-area {
      flex: 1;
      width: 100%;
      padding: 40px 20px;
      min-height: 400px;
      background: #eaebe3;
    }

    .bot-intro {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px 6px 20px;
      font-size: 1rem;
    }

    .bot-icon {
      width: 14px;
      height: 14px;
      background-color: #dcd6c4;
      border-radius: 2px;
    }

    .input-row {
      display: flex;
      align-items: center;
      width: 100%;
      border-top: 1px solid #ddd8c9;
      padding: 12px 20px 20px 20px;
      background: #eaebe3;
    }

    input[type="text"] {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 1rem;
      font-family: 'EB Garamond', serif;
      outline: none;
      color: #222;
    }

    input::placeholder {
      color: #999;
    }

    button {
      width: 36px;
      height: 36px;
      background-color: #dddacb;
      border: none;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      font-family: 'EB Garamond', serif;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="logo-row">
    <h1>Lisa</h1>
    <img src="atoms.png" alt="Atoms icon" />
  </div>

  <div class="strip">
    <p>Intelligent reasoning model trained to assist with laboratory operations.</p>
    <div class="claude-label">
      <img src="claude-icon.svg" alt="Claude icon" />
      <span><strong>Claude</strong> Sonnet 4</span>
    </div>
  </div>

  <div class="chat-area"></div>

  <div class="bot-intro">
    <div class="bot-icon"></div>
    <p>Hello! Here to help. Got any questions?</p>
  </div>

  <div class="input-row">
    <input type="text" placeholder="Type a message . . ." />
    <button>↑</button>
  </div>
</body>
</html>
