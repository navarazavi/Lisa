<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lisa</title>
  <style>
    body {
      margin: 0;
      font-family: "Georgia", serif;
      background-color: #f4f4ec;
    }

    header {
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.85), #f4f4ec);
      padding: 30px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      position: relative;
      height: 110px;
    }

    .logo {
      font-size: 64px;
      font-weight: bold;
    }

    .subtitle {
      position: absolute;
      left: 32px;
      bottom: 8px;
      font-size: 13px;
      font-family: "Georgia", serif;
      color: #333;
    }

    main {
      padding: 40px 30px 100px 30px;
      min-height: 70vh;
      font-size: 18px;
    }

    .chat-bubble {
      background-color: #f4f4ec;
      border-left: 6px solid #ccc;
      padding-left: 12px;
      margin-bottom: 16px;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #f4f4ec;
      padding: 10px 30px;
      display: flex;
      align-items: center;
      border-top: 1px solid #dcdccf;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: none;
      font-family: "Georgia", serif;
      font-size: 16px;
      background-color: #f4f4ec;
    }

    input[type="text"]:focus {
      outline: none;
    }

    .send-button {
      background: none;
      border: none;
      font-size: 24px;
      margin-left: 12px;
      cursor: pointer;
      color: #888;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Lisa</div>
    <div class="subtitle">Intelligent reasoning model trained to assist with laboratory operations.</div>
  </header>

  <main>
    <div class="chat-bubble">Hello! Here to help. Got any questions?</div>
  </main>

  <footer>
    <input type="text" placeholder="Type a message . . ." />
    <button class="send-button">⬆️</button>
  </footer>
</body>
</html>
