<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lisa</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #F0EEE6;
      color: #1f2937;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: #F0EEE6;
      padding: 20px 32px 0 32px;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
      position: relative;
    }

    .logo-wrap {
      display: flex;
      align-items: flex-end;
      gap: 14px;
    }

    .logo {
      font-size: 58px;
      font-weight: 500;
      letter-spacing: 2px;
    }

    .logo span {
      font-family: 'Fira Code', monospace;
      color: #D97858;
    }

    .atom-icon {
      height: 52px;
      opacity: 0.8;
      animation: float 3s ease-in-out infinite;
      align-self: flex-start;
      filter: hue-rotate(330deg) saturate(2);
    }

    .claude-logo {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      background-color: #ffffff;
      border: 0.45px solid #3F3F3F;
      color: #111827;
      padding: 4px 8px;
      border-radius: 9999px;
      position: absolute;
      bottom: 10px;
      right: 32px;
      opacity: 0.9;
      box-shadow: 0px 1px 2px rgba(0,0,0,0.03);
    }

    .claude-logo .star {
      color: #D97858;
      margin-right: 4px;
    }

    main {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 24px 32px 12px 32px;
      background-color: #FAF9F5;
      border: 1.15px solid #3F3F3F;
      margin: 0 20px;
      border-radius: 8px;
      box-shadow: inset 0 0 2px rgba(0,0,0,0.03);
    }

    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 16px;
    }

    .chat-bubble {
      font-family: 'Fira Code', monospace;
      font-size: 15px;
      background-color: #f1f5f9;
      color: #1e293b;
      padding: 12px 16px;
      border-radius: 8px;
      width: fit-content;
      display: inline-block;
      max-width: 100%;
      margin-bottom: 24px;
      box-shadow: 0px 1px 2px rgba(0,0,0,0.04);
      border: 0.4px solid black;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 12px;
    }

    .input-row input[type="text"] {
      flex: 1;
      padding: 12px;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      background-color: #F0EEE6;
      color: #1f2937;
      border-radius: 6px;
    }

    .input-row input[type="text"]:focus {
      outline: none;
      background-color: #ffffff;
    }

    .input-row .send-button {
      background-color: #e2e8f0;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      color: #334155;
      box-shadow: inset 0 1px 1px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-wrap">
      <div class="logo">L<span>i</span>SA</div>
      <img src="atoms.png" alt="Atom icon" class="atom-icon" />
    </div>
    <div class="claude-logo"><span class="star">✴︎</span> Claude Sonnet 4</div>
  </header>

  <main>
    <div class="chat-scroll">
      <div class="chat-bubble">Hello! I'm Lisa, your intelligent lab assistant. Got any questions?</div>
    </div>

    <div class="input-row">
      <input type="text" placeholder="Type a message . . ." />
      <button class="send-button" aria-label="Send message">↑</button>
    </div>
  </main>
</body>
</html>
