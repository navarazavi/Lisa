<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lisa</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'EB Garamond', serif;
      background-color: #f4f4ec;
      color: #1a1a1a;
    }

    header {
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.85), #f4f4ec);
      padding: 30px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      position: relative;
      height: 110px;
      border-bottom: 1px solid #e7e7dd;
    }

    .logo {
      font-size: 64px;
      font-weight: normal;
    }

    .subtitle {
      position: absolute;
      left: 32px;
      bottom: 8px;
      font-size: 14px;
      color: #444;
    }

    main {
      padding: 40px 30px 0 30px;
      font-size: 18px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: calc(100vh - 170px);
    }

    .chat-bubble {
      background-color: transparent;
      border-left: 4px solid #dadacb;
      padding-left: 14px;
      margin-bottom: 10px;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #f4f4ec;
      padding: 12px 30px;
      display: flex;
      align-items: center;
      border-top: 1px solid #eeeede;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: none;
      font-family: 'EB Garamond', serif;
      font-size: 16px;
      background-color: #f4f4ec;
    }

    input[type="text"]:focus {
      outline: none;
    }

    .send-button {
      background: none;
      border: none;
      font-size: 20px;
      margin-left: 12px;
      cursor: pointer;
      color: #444;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    .send-button svg {
      width: 20px;
      height: 20px;
      fill: #444;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Lisa</div>
    <div class="subtitle">Intelligent reasoning model trained to assist with laboratory operations.</div>
  </header>

  <main>
    <div class="chat-bubble">Hello! Here to help. Got any questions?</div>
  </main>

  <footer>
    <input type="text" placeholder="Type a message . . ." />
    <button class="send-button" aria-label="Send message">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </footer>
</body>
</html>
