<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lisa</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #F0EEE6;
      color: #3F3F3F;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

     header {
      background-color: #F0EEE6;
      padding: 20px 32px 0 32px;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      position: relative;
    }
  
.logo-wrap {
  display: flex;
  align-items: center; /* was flex-end, this centers vertically */
  gap: 12px;
  position: relative;
}

    .logo {
      font-size: 63px;
      font-weight: 500;
      letter-spacing: 2px;
    }

    .logo span {
      font-family: 'Fira Code', monospace;
      color: #D97858;
    }

   .atom-icon {
  height: 52px;
  margin-top: 4px; /* slight bump down */
  filter: hue-rotate(330deg) saturate(2);
}

    .claude-logo {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      background-color: #ffffff;
      border: 0.55px solid #3F3F3F;
      color: #111827;
      padding: 4px 8px;
      border-radius: 9999px;
      position: absolute;
      bottom: 10px;
      right: 32px;
      opacity: 0.9;
      box-shadow: 0px 1px 2px rgba(0,0,0,0.03);
    }

    .claude-logo .star {
      color: #D97858;
      margin-right: 4px;
      position: absolute;
      bottom: 10px;
      left: 32px;

    }

    .main-wrap {
      display: flex;
      justify-content: center;
      padding: 0 20px 20px;
      flex-grow: 1;
    }

    main {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      max-height: calc(100vh - 160px);
      padding: 24px 32px;
      background-color: #FAF9F5;
      border: 1.15px solid #3F3F3F;
      border-radius: 8px;
      box-shadow: inset 0 0 2px rgba(0,0,0,0.03);
      overflow: hidden;
      width: 100%;
      max-width: 970px;
    }

    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 16px;
    }

    .chat-bubble {
      font-family: 'Fira Code', monospace;
      font-size: 15px;
      background-color: #F0EEE6;
      color: #1e293b;
      padding: 12px 16px;
      border-radius: 8px;
      width: fit-content;
      display: inline-block;
      max-width: 100%;
      margin-bottom: 24px;
      box-shadow: 0px 1px 2px rgba(0,0,0,0.04);
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: auto;
      padding-bottom: 4px;
    }

    .input-row input[type="text"] {
      flex: 1;
      padding: 12px;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      background-color: #F0EEE6;
      color: #1f2937;
      border-radius: 6px;
    }

    .input-row input[type="text"]:focus {
      outline: none;
      background-color: #ffffff;
    }

    .input-row .send-button {
      background-color: #F0EEE6;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      color: #334155;
      box-shadow: inset 0 1px 1px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-wrap">
      <div class="logo">L<span>i</span>SA</div>
      <img src="atoms.png" alt="Atom icon" class="atom-icon" />
    </div>
    <div class="claude-logo"><span class="star">✴︎</span> Claude Sonnet 4</div>
  </header>

  <div class="main-wrap">
    <main>
      <div class="chat-scroll">
        <div class="chat-bubble">Hello! I'm Lisa, your intelligent lab assistant. Got any questions?</div>
      </div>
      <div class="input-row">
        <input type="text" placeholder="Type a message . . ." />
        <button class="send-button" aria-label="Send message">↑</button>
      </div>
    </main>
  </div>
</body>
</html>
