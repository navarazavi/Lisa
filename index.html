<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lisa</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'EB Garamond', serif;
      background-color: #f4f4ec;
      color: #1a1a1a;
    }

    header {
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.75), #f4f4ec 96%);
      padding: 30px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      position: relative;
      height: 110px;
      box-shadow: 0 0.5px 3px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .logo {
      font-size: 64px;
      font-weight: normal;
    }

    .subtitle {
      position: absolute;
      left: 32px;
      bottom: 8px;
      font-size: 14px;
      color: #444;
    }

    main {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: calc(100vh - 170px);
      padding: 0 30px;
      background-color: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .chat-bubble {
      font-size: 16px;
      margin: 12px 0 4px 0;
      padding-left: 16px;
      border-left: 6px solid #dfdfce;
      color: #2e2e2e;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-bubble::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      background-color: #d3d3c3;
      border-radius: 2px;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #f4f4ec;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      box-shadow: 0 -0.5px 3px rgba(0, 0, 0, 0.05);
    }

    .send-button {
      background-color: #e2e2d6;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
      font-size: 16px;
      font-weight: bold;
      color: #555;
      line-height: 1;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: none;
      font-family: 'EB Garamond', serif;
      font-size: 16px;
      background-color: #f4f4ec;
    }

    input[type="text"]:focus {
      outline: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Lisa</div>
    <div class="subtitle">Intelligent reasoning model trained to assist with laboratory operations.</div>
  </header>

  <main>
    <div class="chat-bubble">Hello! Here to help. Got any questions?</div>
  </main>

  <footer>
    <input type="text" placeholder="Type a message . . ." />
    <button class="send-button" aria-label="Send message">↑</button>
  </footer>
</body>
</html>
