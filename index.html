<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lisa</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #f9fafb;
      color: #1f2937;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: #f9fafb;
      padding: 20px 32px 0 32px;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
      position: relative;
    }

    .logo-wrap {
      display: flex;
      align-items: flex-end;
      gap: 14px;
    }

    .logo {
      font-size: 58px;
      font-weight: 500;
      letter-spacing: 2px;
    }

    .logo span {
      font-family: 'Fira Code', monospace;
      color: #D97858;
    }

    .atom-icon {
      height: 52px;
      opacity: 0.8;
      animation: float 3s ease-in-out infinite;
      align-self: flex-start;
    }

    .claude-logo {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      background-color: #ffffff;
      border: 1px solid #D1D5DB;
      color: #111827;
      padding: 4px 8px;
      border-radius: 9999px;
      position: absolute;
      bottom: 10px;
      right: 32px;
      opacity: 0.9;
      box-shadow: 0px 1px 2px rgba(0,0,0,0.03);
    }

    main {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 24px 32px;
      background-color: #ffffff;
      border: 1px solid #D1D5DB;
      margin: 0 20px;
      border-radius: 8px;
      box-shadow: inset 0 0 2px rgba(0,0,0,0.03);
      overflow-y: auto;
    }

    .chat-bubble {
      font-family: 'Fira Code', monospace;
      font-size: 15px;
      background-color: #f1f5f9;
      color: #1e293b;
      padding: 12px 16px;
      border-radius: 8px;
      max-width: 70%;
      margin-bottom: 24px;
      box-shadow: 0px 1px 2px rgba(0,0,0,0.04);
    }

    footer {
      background-color: #f9fafb;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      box-shadow: 0 -0.5px 3px rgba(0, 0, 0, 0.04);
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      background-color: #f9fafb;
      color: #1f2937;
      margin-right: 12px;
    }

    input[type="text"]:focus {
      outline: none;
      background-color: #ffffff;
    }

    .send-button {
      background-color: #e2e8f0;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      color: #334155;
      box-shadow: inset 0 1px 1px rgba(0,0,0,0.1);
    }

  </style>
</head>
<body>
  <header>
    <div class="logo-wrap">
      <div class="logo">L<span>i</span>SA</div>
      <img src="atom1.png" alt="Atom icon" class="atom-icon" />
    </div>
    <div class="claude-logo">✴︎ Claude Sonnet 4</div>
  </header>

  <main>
    <div class="chat-bubble">Hello! I'm Lisa, your intelligent lab assistant. Got any questions?</div>
  </main>

  <footer>
    <input type="text" placeholder="Type a message . . ." />
    <button class="send-button" aria-label="Send message">↑</button>
  </footer>
</body>
</html>
